name: Website quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm test
      - name: Start production test server
        run: node scripts/audit-server.mjs > /tmp/gwency-audit-server.log 2>&1 &
      - name: Audit mobile pages
        env:
          CHROME_PATH: /usr/bin/google-chrome
          LIGHTHOUSE_RUNS: 3
        run: npm run audit:lighthouse
      - name: Enforce Lighthouse thresholds
        run: node scripts/verify-lighthouse.mjs
